      properties:
        areFaultsIgnored:
          type: boolean
        bodyType:
          $ref: '#/components/schemas/GBTBodyType'
        classType:
          type: integer
          format: int32
        configuration:
          type: string
        configurationParameterValues:
          type: array
          items:
            type: string
            format: byte
        configurationParameters:
          type: array
          items:
            type: string
            format: byte
        dataType:
          type: string
        deterministicId:
          type: string
        documentId:
          type: string
        elementId:
          type: string
        elementName:
          type: string
        elementType:
          $ref: '#/components/schemas/GBTElementType'
        featureId:
          type: string
        featureName:
          type: string
        featureSpec:
          type: array
          items:
            type: string
            format: byte
        featureType:
          type: string
        fsComputedPartPropertySpec:
          type: array
          items:
            type: string
            format: byte
        fsTableSpec:
          type: array
          items:
            type: string
            format: byte
        hasFaults:
          type: boolean
        href:
          type: string
          description: URI to fetch complete information of the resource.
          format: uri
        id:
          type: string
          description: Id of the resource.
        insertableQuery:
          type: string
        isFlattenedBody:
          type: boolean
        isMesh:
          type: boolean
        meshState:
          $ref: '#/components/schemas/GBTMeshState'
        microversionId:
          type: string
        name:
          type: string
          description: Name of the resource.
        parentId:
          type: string
        partIdentity:
          type: string
        partName:
          type: string
        predictableThumbnailId:
          type: string
        sourceFileExtension:
          type: string
        thumbnailUri:
          type: string
        unflattenedPartDeterministicId:
          type: string
        variableName:
          type: string
        versionId:
          type: string
        versionName:
          type: string
        viewRef:
          type: string
          description: URI to visualize the resource in a webclient if applicable.
          format: uri
        workspaceId:
          type: string
        workspaceName:
          type: string
      description: Array of items in the current page.
    GBTBodyType:
      type: string
      enum:
      - SOLID
      - SHEET
      - WIRE
      - POINT
      - MATE_CONNECTOR
      - COMPOSITE
      - UNKNOWN
    BTListResponseBTInsertableInfo:
      type: object
      properties:
        href:
          type: string
          description: URI for current page of resources.
          format: uri
        items:
          type: array
          description: Array of items in the current page.
          items:
            $ref: '#/components/schemas/BTInsertableInfo'
        next:
          type: string
          description: URI for next page of the resources if more are available.
          format: uri
        previous:
          type: string
          description: URI for previous page of the resources.
          format: uri
      description: A list of resources that typically supports paging.
    GBTElementType:
      type: string
      enum:
      - PARTSTUDIO
      - ASSEMBLY
      - DRAWING
      - FEATURESTUDIO
      - BLOB
      - APPLICATION
      - TABLE
      - BILLOFMATERIALS
      - VARIABLESTUDIO
      - PUBLICATIONITEM
      - UNKNOWN
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Use OAuth 2.0 to authenticate requests.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
