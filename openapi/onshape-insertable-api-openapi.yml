servers:
- url: https://cad.onshape.com/api/v16
  description: Current
security:
- BasicAuth: []
tags:
- name: Insertable
  description: Access the list of things that can be inserted into a document.
paths:
  /insertables/d/{did}/latest:
    get:
      tags:
      - Insertable
      summary: Get a list of things in this document that can be inserted elsewhere.
      description: "* Returns only the latest revision of released insertables. \n* Use the document ID (`did`) parameter to specify the source document, not the insertion target. \n* For example, you can insert a custom Feature library into another custom Feature library, insert Parts into an Assembly or a Drawing, etc."
      operationId: getLatestInDocument
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
      - name: includeParts
        in: query
        schema:
          type: boolean
          default: false
      - name: includeSurfaces
        in: query
        schema:
          type: boolean
          default: false
      - name: includeSketches
        in: query
        schema:
          type: boolean
          default: false
      - name: includeReferenceFeatures
        in: query
        schema:
          type: boolean
          default: false
      - name: includeAssemblies
        in: query
        schema:
          type: boolean
          default: false
      - name: includeFeatureStudios
        in: query
        schema:
          type: boolean
          default: false
      - name: includeBlobs
        in: query
        schema:
          type: boolean
          default: false
      - name: allowedBlobMimeTypes
        in: query
        schema:
          type: string
          default: ''
      - name: excludeNewerFSVersions
        in: query
        schema:
          type: boolean
          default: false
      - name: maxFeatureScriptVersion
        in: query
        schema:
          type: integer
          format: int32
      - name: includePartStudios
        in: query
        schema:
          type: boolean
          default: false
      - name: includeFeatures
        in: query
        schema:
          type: boolean
          default: false
      - name: includeMeshes
        in: query
        schema:
          type: boolean
          default: false
      - name: includeWires
        in: query
        schema:
          type: boolean
          default: false
      - name: includeFlattenedBodies
        in: query
        schema:
          type: boolean
          default: false
      - name: includeApplications
        in: query
        schema:
          type: boolean
          default: false
      - name: allowedApplicationMimeTypes
        in: query
        schema:
          type: string
          default: ''
      - name: includeCompositeParts
        in: query
        schema:
          type: boolean
          default: false
      - name: includeFSTables
        in: query
        schema:
          type: boolean
          default: false
      - name: includeFSComputedPartPropertyFunctions
        in: query
        schema:
          type: boolean
          default: false
      - name: includeVariables
        in: query
        schema:
          type: boolean
          default: false
      - name: includeVariableStudios
        in: query
        schema:
          type: boolean
          default: false
      - name: allowedBlobExtensions
        in: query
        schema:
          type: string
          default: ''
      - name: isObsoletion
        in: query
        schema:
          type: boolean
          default: false
      responses:
        default:
          description: default response
          content:
            application/json;charset=UTF-8; qs=0.09:
              schema:
                $ref: '#/components/schemas/BTListResponseBTInsertableInfo'
      deprecated: false
      security:
      - OAuth2:
        - OAuth2Read
        BasicAuth:
        - OAuth2Read
      x-BTVisibility: PRODUCTION
components:
