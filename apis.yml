aid: onshape
name: Onshape
description: >-
  Onshape is a cloud-native computer-aided design (CAD) and product data management
  (PDM) platform, part of PTC, that runs entirely in a web browser with real-time
  collaboration, versioning, and configurations. Its public REST API (OpenAPI 3.0.1,
  base https://cad.onshape.com/api/v16) exposes documents, workspaces, versions and
  microversions, Part Studios, parts, assemblies, drawings, metadata, translations
  (CAD import/export), release management, and webhooks. Authentication is via OAuth 2.0
  or HMAC-signed API keys, with offset/limit pagination and per-endpoint plus annual
  API call limits. Onshape was surfaced as an a16z portfolio company and enriched with
  its real developer surface by the API Evangelist pipeline.
url: https://raw.githubusercontent.com/api-evangelist/onshape/refs/heads/main/apis.yml
